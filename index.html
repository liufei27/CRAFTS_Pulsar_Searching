<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRAFTS 条带天区查询 · FAST 19 波束漂移扫描</title>
<link rel="stylesheet" href="css/style.css?v=20261111c">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <header class="brand">
      <div class="brand-top">
        <div class="brand-kicker">
          <a href="https://fast.bao.ac.cn/" target="_blank" rel="noopener noreferrer" title="FAST 官网">FAST</a>
          <span class="kicker-sep">·</span>
          <a href="https://groups.bao.ac.cn/ism/" target="_blank" rel="noopener noreferrer" title="CRAFTS 官网">CRAFTS</a>
        </div>
        <div class="lang" id="lang">
          <button data-lang="zh" class="active">中文</button>
          <button data-lang="en">EN</button>
        </div>
      </div>
      <h1 data-i18n-html="brand.title">FAST 19 波束漂移扫描同时巡天<br>覆盖可视化</h1>
    </header>

    <section class="block">
      <label class="label" for="q" data-i18n="label.query">条带编号</label>
      <div class="search">
        <input id="q" type="text" autocomplete="off" spellcheck="false"
               data-i18n-ph="ph.query" placeholder="Dec-0409 / +2820 / #117">
        <button id="go" data-i18n="btn.locate">定位</button>
      </div>
      <div class="hintline" id="qhint" data-i18n="hint.query">Dec±DDMM · 条带全名 · #序号 0–221</div>
      <div id="suggest" class="suggest"></div>
    </section>

    <section class="block">
      <div class="label" data-i18n="label.frame">坐标系</div>
      <div class="segmented" id="projseg">
        <button class="seg active" data-kind="eq" data-i18n="seg.eq">赤道坐标</button>
        <button class="seg" data-kind="gal" data-i18n="seg.gal">银道坐标</button>
      </div>
    </section>

    <section class="block">
      <div class="label" data-i18n="label.layers">图层</div>
      <div class="layers" id="layers">
        <button class="chip on" data-layer="plan" data-i18n="chip.plan">计划条带</button>
        <button class="chip on" data-layer="observed" data-i18n="chip.observed">已搜索条带</button>
        <button class="chip on" data-layer="atnf" data-i18n="chip.atnf">ATNF 脉冲星</button>
        <button class="chip on" data-layer="pulsars" data-i18n="chip.crafts">CRAFTS 脉冲星</button>
        <button class="chip on" data-layer="milky" data-i18n="chip.milky">银道面</button>
        <button class="chip on" data-layer="grid" data-i18n="chip.grid">坐标网格</button>
        <button class="chip on" data-layer="labels" data-i18n="chip.labels">坐标标注</button>
        <button class="chip on" data-layer="za" data-i18n="chip.za">ZA 界限</button>
        <button class="chip on" data-layer="zenith" data-i18n="chip.zenith">FAST 天顶</button>
        <button class="chip on" data-layer="sun" data-i18n="chip.sun">太阳</button>
        <button class="chip on" data-layer="radio" data-i18n="chip.radio">射电天文学十大标志性天体</button>
      </div>
      <div class="sublayer" id="radioList" hidden></div>
    </section>

    <section class="block">
      <div class="label"><span data-i18n="label.searched">已搜索条带</span>
        <span class="count" id="obsCount"></span>
        <span class="sort" id="sort">
          <button data-sort="desc" class="active" data-i18n="sort.desc">高→低</button>
          <button data-sort="asc" data-i18n="sort.asc">低→高</button>
        </span>
      </div>
      <ul class="striplist" id="striplist"></ul>
    </section>

    <section class="block card" id="info">
      <div class="label" data-i18n="label.detail">条带详情</div>
      <div id="infoBody" class="info-empty">在图上悬停，或输入条带编号后定位</div>
    </section>

    <footer class="foot">
      <div data-i18n="foot.plan">计划条带 222 条 · Dec −13.9° ~ +65.9°</div>
      <div class="muted" data-i18n="foot.src">数据来源于CRAFTS 官网</div>
      <div class="sync" id="syncInfo"></div>
    </footer>
  </aside>

  <main class="stage">
    <canvas id="sky"></canvas>

    <div class="tooltip" id="tooltip" aria-hidden="true"></div>

    <div class="stage-top">
      <div class="title" id="stageTitle">赤道坐标 · Mollweide</div>
      <div class="toolbar">
        <button class="icon" id="refresh" data-i18n-title="title.refresh" title="从腾讯文档刷新数据">⟳</button>
        <button class="icon" id="zoomIn" data-i18n-title="title.zoomIn" title="放大">＋</button>
        <button class="icon" id="zoomOut" data-i18n-title="title.zoomOut" title="缩小">−</button>
        <button class="icon wide" id="reset" data-i18n-title="title.reset" title="复位视图" data-i18n="btn.reset">复位</button>
      </div>
    </div>

    <div class="stage-bottom">
      <span class="key"><i class="sw sw-plan"></i><span data-i18n="legend.plan">计划覆盖</span></span>
      <span class="key"><i class="sw sw-obs"></i><span data-i18n="legend.searched">已搜索</span></span>
      <span class="key"><i class="sw sw-hot"></i><span data-i18n="legend.current">当前条带</span></span>
      <span class="key"><i class="sw sw-atnf"></i><span data-i18n="legend.atnf">ATNF 脉冲星</span></span>
      <span class="key"><i class="sw sw-psr"></i><span data-i18n="legend.crafts">CRAFTS 脉冲星</span></span>
      <span class="muted hint-keys" data-i18n="hint.keys">滚轮缩放 · 拖拽平移 · 双击复位 · Esc 取消</span>
    </div>

    <div class="coords" id="coords">RA —, Dec —</div>
  </main>
</div>

<script>
  // 同步服务的地址：file:// 打开时指本机 8765；部署到服务器时用同源 /api/sync
  var HOST = location.hostname;
  var IS_STATIC = /(^|\.)(github\.io|pages\.dev|netlify\.app|vercel\.app|surge\.sh)$/.test(HOST);
  window.CRAFTS_CONFIG = {
    // 静态托管上没有后端，按钮改为隐藏；本机/自建服务器保留「立即同步」
    syncEndpoint: IS_STATIC ? null
      : (location.protocol === 'file:' ? 'http://127.0.0.1:8765' : ''),
    // 公网页面的数据走 data 分支（raw 直出，推送后 1-2 秒可用），绕开 Pages 构建队列
    liveUrl: IS_STATIC
      ? 'https://raw.githubusercontent.com/liufei27/CRAFTS_Pulsar_Searching/data/live.json'
      : null
  };
</script>
<script src="js/data.js?v=20261111c"></script>
<script src="js/live.js?v=20261111c"></script>
<script src="js/i18n.js?v=20261111c"></script>
<script src="js/astro.js?v=20261111c"></script>
<script src="js/app.js?v=20261111c"></script>
</body>
</html>
